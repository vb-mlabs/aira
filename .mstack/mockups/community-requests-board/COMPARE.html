<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIRA · Community Requests Board — variant compare</title>
  <style>
    :root {
      --bg: #EAE0CB;
      --fg: #3D2814;
      --muted: #735239;
      --primary: #4F653B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid rgba(130, 106, 64, 0.25);
      background: #F3EBDD;
    }
    header h1 {
      margin: 0 0 4px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
    }
    header p { margin: 0; color: var(--muted); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 90px);
    }
    .card {
      display: flex;
      flex-direction: column;
      background: #F3EBDD;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(61, 40, 20, 0.14);
      overflow: hidden;
    }
    .card-head {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(130, 106, 64, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-head h2 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      font-weight: 600;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: var(--bg);
    }
    .open-full {
      font-size: 11px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    .open-full:hover { text-decoration: underline; }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; height: auto; }
      iframe { height: 1200px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Community Requests Board — variant compare</h1>
    <p>Hierarchy / density axis. Each iframe scrolls; scroll within to compare the board and post-detail treatments.</p>
  </header>
  <div class="grid">
    <div class="card">
      <div class="card-head">
        <div>
          <span class="badge">v1</span>
          <h2>Compact list</h2>
        </div>
        <a class="open-full" href="v1/index.html" target="_blank">Open full ↗</a>
      </div>
      <iframe src="v1/index.html" title="v1"></iframe>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <span class="badge">v2</span>
          <h2>Editorial cards</h2>
        </div>
        <a class="open-full" href="v2/index.html" target="_blank">Open full ↗</a>
      </div>
      <iframe src="v2/index.html" title="v2"></iframe>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <span class="badge">v3</span>
          <h2>Featured + dense feed</h2>
        </div>
        <a class="open-full" href="v3/index.html" target="_blank">Open full ↗</a>
      </div>
      <iframe src="v3/index.html" title="v3"></iframe>
    </div>
  </div>
</body>
</html>
